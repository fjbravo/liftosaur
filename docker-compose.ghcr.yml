# Overlay that swaps local image builds for the prebuilt images published to
# GitHub Container Registry by .github/workflows/selfhosted-images.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Prerequisites:
#   - The GHCR packages are public, or you ran `docker login ghcr.io` with a
#     token that has read:packages.
#   - The images were built with a LIFTOSAUR_HOST repository variable matching
#     the HOST in your .env - the public URL is baked in at build time.
#
# LIFTOSAUR_IMAGE_REPO defaults to this repository's packages; LIFTOSAUR_IMAGE_TAG
# defaults to `latest` (published from the default branch). Both can be set in .env.

services:
  web:
    image: ${LIFTOSAUR_IMAGE_REPO:-ghcr.io/fjbravo/liftosaur}-web:${LIFTOSAUR_IMAGE_TAG:-latest}
    pull_policy: always

  server:
    image: ${LIFTOSAUR_IMAGE_REPO:-ghcr.io/fjbravo/liftosaur}-server:${LIFTOSAUR_IMAGE_TAG:-latest}
    pull_policy: always

  cron:
    image: ${LIFTOSAUR_IMAGE_REPO:-ghcr.io/fjbravo/liftosaur}-server:${LIFTOSAUR_IMAGE_TAG:-latest}
    pull_policy: always

  bootstrap:
    image: ${LIFTOSAUR_IMAGE_REPO:-ghcr.io/fjbravo/liftosaur}-server:${LIFTOSAUR_IMAGE_TAG:-latest}
    pull_policy: missing
