# Liftosaur self-hosted web tier.
#
# Ports the AWS CloudFront distribution (liftosaur-cdk/liftosaur-cdk.ts) to nginx:
#   - default behavior      -> API Gateway            => fallback proxy to the Node server
#   - LftRewriteUrls        -> URL rewrites/redirects => `rewrite` / `return` below
#   - LftDocsRedirect       -> /docs* => 302 /doc*
#   - LftStripStaticPrefix  -> /static/* => static root
#   - LftStripPathPrefix    -> /userimages/*, /externalimages/* => object storage
#   - LftAddCharset         -> `charset utf-8` + charset_types
# X-Auth-State / X-Device-Type are NOT set here: they only existed as CloudFront
# cache-key headers, and the Node server computes both from the request itself.

map $http_x_forwarded_proto $lft_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Docker's embedded DNS, resolved per-request via the variables below, so nginx starts
  # even when the server/minio containers are not up yet (a literal proxy_pass host is
  # resolved once at config load and hard-fails the boot).
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $lft_api      "server:3000";
  set $lft_stream   "server:3001";
  set $lft_objects  "minio:9000";

  root /usr/share/nginx/html;

  charset utf-8;
  charset_types
    text/css
    text/plain
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  client_max_body_size 20m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    application/wasm
    image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $lft_forwarded_proto;
  proxy_set_header X-Forwarded-Host $host;

  # ---------------------------------------------------------------- LftRewriteUrls: redirects

  location = /app {
    return 301 /app/;
  }

  location = /blog {
    return 301 /blog/;
  }

  # ---------------------------------------------------------------- LftDocsRedirect

  location = /docs {
    return 302 /doc;
  }

  location ^~ /docs/ {
    rewrite ^/docs/$        /doc      redirect;
    rewrite ^/docs(/.*)$    /doc$1    redirect;
  }

  location = /blog/docs {
    return 302 /doc;
  }

  location ^~ /blog/docs/ {
    rewrite ^/blog/docs/$     /doc     redirect;
    rewrite ^/blog/docs(/.*)$ /doc$1   redirect;
  }

  # ---------------------------------------------------------------- LftRewriteUrls: API rewrites

  location = / {
    rewrite ^ /main break;
    proxy_pass http://$lft_api;
  }

  location = /about {
    rewrite ^ /main break;
    proxy_pass http://$lft_api;
  }

  location = /record {
    rewrite ^ /api/record break;
    proxy_pass http://$lft_api;
  }

  location = /recordimage {
    rewrite ^ /api/recordimage break;
    proxy_pass http://$lft_api;
  }

  location ^~ /programimage/ {
    rewrite ^/programimage/(.*)$ /api/programimage/$1 break;
    proxy_pass http://$lft_api;
  }

  location ^~ /profileimage/ {
    rewrite ^/profileimage/(.+)$ /profileimage?user=$1 break;
    proxy_pass http://$lft_api;
  }

  location ^~ /profile/ {
    rewrite ^/profile/(.+)$ /profile?user=$1 break;
    proxy_pass http://$lft_api;
  }

  # ---------------------------------------------------------------- streaming (SSE)

  location ^~ /stream/ {
    proxy_pass http://$lft_stream;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding off;
    gzip off;
  }

  # ---------------------------------------------------------------- LftStripPathPrefix: object storage

  location ^~ /userimages/ {
    rewrite ^/userimages/(.*)$ /liftosauruserimages/$1 break;
    proxy_pass http://$lft_objects;
    proxy_set_header Host $lft_objects;
    proxy_intercept_errors off;
  }

  location ^~ /externalimages/ {
    rewrite ^/externalimages/(.*)$ /liftosaurimages2/$1 break;
    proxy_pass http://$lft_objects;
    proxy_set_header Host $lft_objects;
    proxy_intercept_errors off;
  }

  # ---------------------------------------------------------------- presigned S3 URLs
  #
  # With S3_PUBLIC_ENDPOINT == HOST the server hands the browser presigned URLs of the
  # form ${HOST}/<bucket>/<key>?X-Amz-... (path-style). Those two buckets must therefore
  # be reachable under their real names on the public origin, with the path untouched:
  # SigV4 signs the canonical path AND the Host header, so any rewrite or Host override
  # here invalidates the signature MinIO recomputes.
  # $http_host, not $host: $host drops the port, and the signature covers the authority
  # exactly as it appeared in the URL (e.g. "localhost:8080").

  # Presigned PUT target for user image uploads (lambda/index.ts postImageUploadUrlHandler).
  location ^~ /liftosauruserimages/ {
    client_max_body_size 50m;
    proxy_pass http://$lft_objects;
    proxy_set_header Host $http_host;
    proxy_intercept_errors off;
  }

  # Presigned GET target for exception payload downloads.
  location ^~ /liftosaurexceptions2/ {
    proxy_pass http://$lft_objects;
    proxy_set_header Host $http_host;
    proxy_intercept_errors off;
  }

  # ---------------------------------------------------------------- static assets

  # Content-hashed filenames, deployed with a 1y immutable policy in the CDK.
  location ^~ /chunks/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # CDK serves these with an explicit no-cache policy so program data updates land immediately.
  location ^~ /programdata/ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location ^~ /static/ {
    alias /usr/share/nginx/html/;
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /app/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /app/index.html =404;
  }

  # ---------------------------------------------------------------- default: file if present, else the API

  # CloudFront's default behavior is the API, with static assets carved out by suffix/prefix
  # patterns. The API route surface is large and grows, so the fallback is inverted here:
  # serve the file when the build actually produced one, otherwise hand the path to the server.
  location / {
    add_header Cache-Control "public, max-age=86400" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri ${uri}index.html @server;
  }

  location @server {
    proxy_pass http://$lft_api;
  }
}
